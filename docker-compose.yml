version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ksc-omr-backend
    restart: always
    environment:
      - PORT=8000
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL:-}
      - ENVIRONMENT=production
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://ksciq.com,https://www.ksciq.com}
      - TZ=Asia/Baghdad
    volumes:
      - omr_data:/app/data
    networks:
      - ksc-network
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ksc-omr-frontend
    restart: always
    environment:
      - TZ=Asia/Baghdad
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - ksc-network

volumes:
  omr_data:
    driver: local

networks:
  ksc-network:
    driver: bridge
